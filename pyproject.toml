[project]
name = "birdapp"
version = "2.1.4"
description = "A CLI tool for generating and posting tweets using LLMs and the Twitter/X API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests-oauthlib>=1.3.1",
    "requests>=2.32.3",
    "platformdirs>=4.3.6",
    "sqlmodel>=0.0.31",
    "openai>=1.0.0",
    "sqlite-vec>=0.1.0",
]

[project.scripts]
birdapp = "birdapp.main:main"

[project.optional-dependencies]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birdapp"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "python-semantic-release>=10.4.1",
    "ruff>=0.16.1",
    "ty>=0.0.13",
    "types-requests>=2.32.4.20250809",
]

[tool.ruff.lint.per-file-ignores]
# These modules are the CLI's error boundaries: each command handler and each
# `(success, message)`-returning API wrapper deliberately catches `Exception`
# so a failure becomes a printed message or a return value rather than a
# traceback. BLE001 stays enabled everywhere else.
"birdapp/main.py" = ["BLE001"]
"birdapp/media.py" = ["BLE001"]
"birdapp/storage/embeddings.py" = ["BLE001"]
"birdapp/tweet.py" = ["BLE001"]
"birdapp/user.py" = ["BLE001"]

[tool.semantic_release]
assets = []
build_command_env = []
build_command = "pip install build && python -m build"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = false
no_git_verify = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version:nf"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = false
